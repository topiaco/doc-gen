configVersion: v2

project:
  name: Minimal Catalog API
  version: 1.0.0
  module: example.com/doc-gen-minimal
  framework: gin
  openapiVersion: 3.0.3

source:
  routePackages:
    - ./...
  analysisPackages: []

files:
  selection: selection.yaml
  overrides: overrides
  output: openapi.json
  report: report.json

responseWrappers:
  envelope:
    dataProperty: payload
    schema:
      type: object
      required: [status, payload]
      properties:
        status:
          type: string
          enum: [ok]
        payload: {}

responseFunctions:
  - symbol: example.com/doc-gen-minimal.Respond
    kind: json
    status: 200
    dataArgument: 1
    wrapper: envelope
    dataTarget: true

parameterHelpers: []
schemaMappings: {}

quality:
  minimumRouteDiscoveryCoverage: 100
  minimumManagedExactSchemaCoverage: 100
  failOnDuplicateOperationID: true
  failOnInvalidOpenAPI: true
  failOnUnresolvedManagedPath: true
  failOnUnknownManagedResponse: true
  failOnOrphanSelection: true
  failOnOrphanOverride: true
